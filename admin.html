<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言审核后台 · 林远见路</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --paper:#f6f1e7;--paper-2:#fbf8f1;--ink:#2b2722;--ink-soft:#5c554b;--ink-faint:#8a8074;
    --line:#e3dac8;--accent:#9a3b2e;--accent-2:#b8794a;--accent-3:#2e5a77;--accent-4:#4a6b3a;
    --shadow:0 12px 40px rgba(43,39,34,.10);
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.75;min-height:100vh;
    background-image:radial-gradient(circle at 18% 8%,rgba(184,121,74,.06),transparent 42%),radial-gradient(circle at 84% 88%,rgba(46,90,119,.05),transparent 46%);}
  .container{max-width:880px;margin:0 auto;padding:40px 24px 80px;}
  .head{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line);}
  .head h1{font-family:var(--serif);font-size:26px;margin-bottom:6px;}
  .head .sub{font-size:13px;color:var(--ink-faint);}
  .head .line{width:60px;height:3px;background:var(--accent);margin:14px auto 0;border-radius:3px;}

  /* 登录区 */
  .auth-box{max-width:380px;margin:50px auto;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow);}
  .auth-box h2{font-family:var(--serif);font-size:20px;text-align:center;margin-bottom:20px;color:var(--accent);}
  .auth-box .field{margin-bottom:14px;}
  .auth-box label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .auth-box input{width:100%;font-family:var(--sans);font-size:14.5px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:none;transition:.18s;}
  .auth-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(154,59,46,.1);}
  .auth-box .btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.18s;margin-top:6px;}
  .auth-box .btn:hover{background:#7f2f24;}
  .auth-box .err{color:var(--accent);font-size:13px;text-align:center;min-height:20px;margin-top:8px;}
  .auth-box .note{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:18px;line-height:1.7;}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .auth-tab{flex:1;text-align:center;padding:10px 0;font-size:14px;cursor:pointer;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.16s;font-family:var(--sans);background:none;border-top:none;border-left:none;border-right:none;}
  .auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .auth-box .warn{background:rgba(184,121,74,.1);border:1px solid rgba(184,121,74,.3);color:var(--accent-2);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;line-height:1.7;}

  /* 站长后台 */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
  .bar .user{font-family:var(--serif);font-size:15px;color:var(--accent);}
  .bar .actions{display:flex;gap:8px;align-items:center;}
  .filter{display:flex;gap:6px;flex-wrap:wrap;}
  .filter select,.filter option{font-family:var(--sans);font-size:13px;}
  .btn{font-family:var(--sans);font-size:13.5px;padding:8px 18px;border-radius:24px;cursor:pointer;transition:.18s;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .btn.primary:hover{background:#7f2f24;}
  .btn.danger{color:var(--accent);border-color:rgba(154,59,46,.35);}
  .btn.danger:hover{background:rgba(154,59,46,.08);}

  .stat-row{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .stat{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px 22px;flex:1;min-width:140px;}
  .stat .k{font-size:12px;color:var(--ink-faint);margin-bottom:4px;}
  .stat .v{font-family:var(--serif);font-size:22px;color:var(--accent);}

  .section-title{font-family:var(--serif);font-size:18px;margin:28px 0 14px;display:flex;align-items:center;gap:8px;}
  .section-title .badge{font-size:12px;background:rgba(154,59,46,.12);color:var(--accent);padding:2px 10px;border-radius:12px;font-family:var(--sans);}

  .item{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px;}
  .item.pending{border-left:4px solid var(--accent-2);}
  .item.featured{border-left:4px solid var(--accent-4);}
  .item .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .item .who{font-family:var(--serif);font-size:14px;color:var(--accent);font-weight:600;}
  .item .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(184,121,74,.14);color:var(--accent-2);font-family:var(--serif);}
  .item .when{font-size:12px;color:var(--ink-faint);}
  .item .body{font-size:14.5px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;margin-bottom:12px;}
  .item .ops{display:flex;gap:8px;flex-wrap:wrap;}

  .empty{text-align:center;color:var(--ink-faint);padding:40px 0;font-style:italic;font-size:14px;}
  .denied{text-align:center;padding:60px 20px;}
  .denied h2{font-family:var(--serif);color:var(--accent);font-size:22px;margin-bottom:10px;}
  .denied p{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <h1>留言审核后台</h1>
    <div class="sub">林远见路 · shenzhen-ai.icu</div>
    <div class="line"></div>
  </div>
  <div id="app"></div>
</div>

<script src="js/av-min.js?v=20260911a"></script>
<script src="js/appdata.js?v=20260911a"></script>
<script>
(function(){
  'use strict';
  var app = document.getElementById('app');
  var user = null;
  var authMode = 'login'; // login | register

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    var M=d.getMonth()+1,D=d.getDate(),h=d.getHours(),m=d.getMinutes();
    return d.getFullYear()+'.'+M+'.'+D+' '+h+':'+(m<10?'0'+m:m);
  }

  function init(){
    if(!window.AppData){ app.innerHTML='<div class="empty">数据服务未加载</div>'; return; }
    AppData.init();
    var u = AppData.getUser();
    if(u){ user = u; if(!u._username && u.email) u._username = u.email.split('@')[0]; }
    render();
  }

  function render(){
    if(!user){ renderLogin(); return; }
    if(!AppData.isAdmin()){ renderDenied(); return; }
    renderDashboard();
  }

  function renderLogin(){
    var isLogin = authMode === 'login';
    var warnHtml = isLogin ? '' :
      '<div class="warn">⚠️ 首次使用请在此注册站长账号，<b>用户名必须填写 admin</b>，密码请牢记。<br>该账号仅用于审核留言，注册后不可更改用户名。</div>';
    app.innerHTML =
      '<div class="auth-box">' +
      '<div class="auth-tabs">' +
        '<button class="auth-tab' + (isLogin?' active':'') + '" data-mode="login">登录</button>' +
        '<button class="auth-tab' + (!isLogin?' active':'') + '" data-mode="register">注册</button>' +
      '</div>' +
      '<h2>' + (isLogin?'站长登录':'注册站长账号') + '</h2>' +
      warnHtml +
      '<div class="field"><label>用户名</label><input type="text" id="lg-uname" placeholder="' + (isLogin?'站长用户名':'请填写 admin') + '" maxlength="20"' + (!isLogin?' value="admin"':'') + '></div>' +
      '<div class="field"><label>密码</label><input type="password" id="lg-pwd" placeholder="密码（至少 6 位）"></div>' +
      '<button class="btn" id="lg-btn">' + (isLogin?'登录':'注册并进入') + '</button>' +
      '<div class="err" id="lg-err"></div>' +
      '<div class="note">仅站长账号可进入审核后台。<br>如忘记密码，请在 LeanCloud 控制台处理。</div>' +
      '</div>';
    var self = this;
    document.querySelectorAll('.auth-tab').forEach(function(t){
      t.addEventListener('click', function(){
        authMode = t.getAttribute('data-mode');
        renderLogin();
      });
    });
    document.getElementById('lg-btn').addEventListener('click', doAuth);
    document.getElementById('lg-pwd').addEventListener('keydown', function(e){ if(e.key==='Enter') doAuth(); });
    document.getElementById('lg-uname').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('lg-pwd').focus(); });
  }

  function doAuth(){
    var name = document.getElementById('lg-uname').value.trim();
    var pwd = document.getElementById('lg-pwd').value;
    var err = document.getElementById('lg-err');
    if(!name){ err.textContent='请输入用户名'; return; }
    if(pwd.length < 6){ err.textContent='密码至少 6 位'; return; }
    if(authMode === 'register' && name !== 'admin'){
      err.textContent = '站长账号用户名必须为 admin';
      return;
    }
    err.textContent = '';
    var btn = document.getElementById('lg-btn');
    btn.disabled = true;
    btn.textContent = authMode === 'login' ? '登录中…' : '注册中…';
    var fn = authMode === 'login' ? AppData.login : AppData.register;
    fn.call(AppData, name, pwd).then(function(u){
      u._username = name; user = u; render();
    }).catch(function(e){
      err.textContent = (e&&e.message)?e.message:(authMode==='login'?'登录失败':'注册失败');
      btn.disabled = false;
      btn.textContent = authMode === 'login' ? '登录' : '注册并进入';
    });
  }

  function renderDenied(){
    app.innerHTML = '<div class="denied"><h2>仅站长可访问</h2><p>当前账号无审核权限。<br>请用站长账号登录。</p></div>';
  }

  var pendingList = [];
  var featuredList = [];
  var filterKey = '';

  function renderDashboard(){
    app.innerHTML =
      '<div class="bar"><span class="user">👤 ' + esc(user._username||'站长') + '</span>' +
      '<div class="actions"><button class="btn" id="refresh">刷新</button><button class="btn danger" id="logout">退出</button></div></div>' +
      '<div class="stat-row"><div class="stat"><div class="k">待审核</div><div class="v" id="stat-pending">-</div></div>' +
      '<div class="stat"><div class="k">已精选</div><div class="v" id="stat-featured">-</div></div></div>' +
      '<div class="filter"><label style="font-size:13px;color:var(--ink-soft);align-self:center;">页面：</label>' +
      '<select id="pageFilter"><option value="">全部</option>' +
      '<option value="life-design">人生设计</option>' +
      '<option value="book-notes">必读书目</option>' +
      '<option value="money-mind">搞钱心智</option>' +
      '<option value="index">首页</option>' +
      '<option value="global">通用</option></select></div>' +
      '<div class="section-title">⏳ 待审核 <span class="badge" id="badge-pending">0</span></div>' +
      '<div id="pending-box"><div class="empty">加载中…</div></div>' +
      '<div class="section-title">✅ 已精选 <span class="badge" id="badge-featured">0</span></div>' +
      '<div id="featured-box"><div class="empty">加载中…</div></div>';
    document.getElementById('refresh').addEventListener('click', loadAll);
    document.getElementById('logout').addEventListener('click', function(){
      AppData.logout(); user = null; render();
    });
    document.getElementById('pageFilter').addEventListener('change', function(){
      filterKey = this.value; loadAll();
    });
    loadAll();
  }

  function loadAll(){
    var pk = filterKey || null;
    AppData.getPendingComments(pk).then(function(list){
      pendingList = list || [];
      renderPending();
    });
    AppData.getFeaturedComments(pk, 100).then(function(list){
      featuredList = list || [];
      renderFeatured();
    });
  }

  function renderPending(){
    document.getElementById('stat-pending').textContent = pendingList.length;
    document.getElementById('badge-pending').textContent = pendingList.length;
    var box = document.getElementById('pending-box');
    if(!pendingList.length){ box.innerHTML = '<div class="empty">没有待审核留言 🎉</div>'; return; }
    box.innerHTML = pendingList.map(function(c,i){
      return '<div class="item pending" id="p-'+c._id+'">' +
        '<div class="meta"><span class="who">' + esc(c.username||'匿名') + '</span>' +
        '<span class="tag">📋 ' + esc(c.pageKey||'global') + '</span>' +
        '<span class="when">' + fmtDate(c.createdAt) + '</span></div>' +
        '<div class="body">' + esc(c.content) + '</div>' +
        '<div class="ops"><button class="btn primary" data-feature="' + c._id + '">✓ 精选</button>' +
        '<button class="btn danger" data-delete="' + c._id + '">删除</button></div></div>';
    }).join('');
    bindPendingOps();
  }

  function renderFeatured(){
    document.getElementById('stat-featured').textContent = featuredList.length;
    document.getElementById('badge-featured').textContent = featuredList.length;
    var box = document.getElementById('featured-box');
    if(!featuredList.length){ box.innerHTML = '<div class="empty">还没有已精选留言</div>'; return; }
    box.innerHTML = featuredList.map(function(c){
      return '<div class="item featured" id="f-'+c._id+'">' +
        '<div class="meta"><span class="who">' + esc(c.username||'匿名') + '</span>' +
        '<span class="tag">📋 ' + esc(c.pageKey||'global') + '</span>' +
        '<span class="when">' + fmtDate(c.createdAt) + '</span></div>' +
        '<div class="body">' + esc(c.content) + '</div>' +
        '<div class="ops"><button class="btn danger" data-unfeature="' + c._id + '">取消精选</button>' +
        '<button class="btn danger" data-delete="' + c._id + '">删除</button></div></div>';
    }).join('');
    bindFeaturedOps();
  }

  function bindPendingOps(){
    document.querySelectorAll('[data-feature]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-feature');
        b.disabled = true; b.textContent = '处理中…';
        AppData.featureComment(id).then(loadAll).catch(function(){ b.disabled=false; b.textContent='✓ 精选'; });
      });
    });
    document.querySelectorAll('#pending-box [data-delete]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!confirm('确认删除这条留言？')) return;
        var id = b.getAttribute('data-delete');
        AppData.deleteComment(id).then(loadAll);
      });
    });
  }

  function bindFeaturedOps(){
    document.querySelectorAll('[data-unfeature]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-unfeature');
        b.disabled = true; b.textContent = '处理中…';
        AppData.unfeatureComment(id).then(loadAll).catch(function(){ b.disabled=false; b.textContent='取消精选'; });
      });
    });
    document.querySelectorAll('#featured-box [data-delete]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!confirm('确认删除这条精选留言？')) return;
        var id = b.getAttribute('data-delete');
        AppData.deleteComment(id).then(loadAll);
      });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
