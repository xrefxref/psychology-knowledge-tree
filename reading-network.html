:root{--paper:#f6f1e7;--ink:#3a322a;--muted:#8a8074;--line:#d9cfbd;--accent:#9a3b22;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);

.noise{position:fixed;inset:0;opacity:.04;pointer-events:none;z-index:0;}

/* ---- hero ---- */
.hero{margin-bottom:18px;}

.hero h1 span{font-weight:400;color:var(--muted);font-size:18px;margin-left:10px;}
.hero p{color:var(--muted);font-size:15px;margin-top:6px;max-width:720px;}

/* ---- stats bar ---- */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 12px;}
.s{background:#fff8ee;border:1px solid var(--line);border-radius:10px;

.s b{font-size:19px;color:var(--accent);margin-right:3px;}

/* ---- toolbar ---- */

  background:#fff8ee;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.toolbar input[type=text]{flex:1;min-width:180px;padding:7px 11px;border:1px solid var(--line);

.toolbar input[type=text]:focus{border-color:var(--accent);}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:16px;

.chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chip.off{opacity:.3;text-decoration:line-through;}
.btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 11px;font-size:12px;font-family:inherit;transition:all .15s;}
.btn:hover{background:#f5efe0;}
.btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---- stage ---- */
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#fbf6ec,#f3ecdd);min-height:560px;}
svg{display:block;width:100%;height:auto;min-height:560px;}

/* ---- nodes ---- */
.node{cursor:pointer;}
.node circle{transition:fill .2s,stroke-width .2s,r .2s,opacity .2s;}
.node text{font-family:inherit;pointer-events:none;transition:opacity .2s;}
line.edge{stroke-linecap:round;transition:opacity .2s,stroke-width .2s;}
.dim{opacity:.07 !important;}
.dim circle{opacity:.07 !important;}

.panel .rel li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;

.panel .rel li:hover{background:#fff3e0;}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;color:#fff;flex-shrink:0;}
.tag.cat{background:var(--muted);}
.tag.author{background:#c2912b;}
/* 卡片与详情 */
.card-pos{font-size:13.5px;line-height:1.7;color:var(--ink);background:#faf4e6;

.detail-btn{cursor:pointer;width:100%;text-align:center;margin:10px 0 4px;

.detail-btn:hover{background:#f5efe0;}
.detail-box{display:none;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;}

.detail-box ul{margin:0;padding-left:18px;}
.detail-box li{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:4px;}
.detail-box .who{font-size:13px;color:var(--ink-soft);}

/* ---- legend & hint ---- */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:5px;}
.swatch{width:13px;height:13px;border-radius:3px;display:inline-block;}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0;}
.back{display:inline-block;margin:16px 8px 0 0;color:var(--accent);text-decoration:none;font-size:13.5px;}
.back:hover{text-decoration:underline;}

/* ---- cluster label bubbles (drawn behind nodes) ---- */
.bubble-label{font-size:13px;font-weight:600;fill:var(--muted);pointer-events:none;text-anchor:middle;}

@media(max-width:768px){
  .panel{position:static;width:auto;margin-top:12px;max-height:none;}

}

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph');
const W=1200, H=900;
const nodes=DATA.nodes, edges=DATA.edges, clusters=DATA.clusters, centers=DATA.centers, adj=DATA.adj;
let activeClusters=new Set(Object.keys(clusters));
let selected=null;

const byId={}; nodes.forEach(n=>byId[n.id]=n);

// ---- 渲染层（先画边，再画节点；边默认隐藏）----
const edgeEls=[], nodeEls={};

// 边（默认 display:none，选中时才 show）
edges.forEach(e=>{
  const el=document.createElementNS(NS,'line');
  el.setAttribute('class','edge');
  const col=e.type==='author'?'#c2912b':'#c0b8a8';
  el.setAttribute('stroke',col);
  el.setAttribute('stroke-width',e.type==='author'?1.8:1);
  el.setAttribute('opacity',e.type==='author'?0.65:0.35);
  el.dataset.type=e.type; el.dataset.s=e.s; el.dataset.t=e.t;
  el.style.display='none';
  svg.appendChild(el); edgeEls.push(el);
});

// 节点
function radius(n){
  if(n.kind==='hub') return 18;
  if(n.ex) return 13;
  return 7 + Math.min(n.deg||0,12)*0.45;
}

function truncate(s,len){
  return s.length>len?s.slice(0,len)+'…':s;
}

nodes.forEach(n=>{
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','node'); g.dataset.id=n.id;
  const c=document.createElementNS(NS,'circle');
  const r=radius(n);
  c.setAttribute('r',r);
  c.setAttribute('fill', n.kind==='hub' ? clusters[n.cl].color+'18' : clusters[n.cl].color);
  c.setAttribute('stroke', n.ex ? '#9a3b22' : (n.kind==='hub' ? clusters[n.cl].color : '#fff'));
  c.setAttribute('stroke-width', n.ex?2.5:(n.kind==='hub'?2:1));
  c.setAttribute('opacity', n.kind==='hub'?0.25:1);
  g.appendChild(c);

  // 书名标签（始终显示，hub 显示分类名）
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('y', r+14);
  tx.setAttribute('text-anchor','middle');
  tx.setAttribute('font-size', n.kind==='hub'?13:10.5);
  tx.setAttribute('fill', n.kind==='hub' ? clusters[n.cl].color : '#3a322a');
  tx.setAttribute('font-weight', n.kind==='hub'?600:400);
  if(n.kind==='hub'){
    tx.textContent=n.t.split('-')[0] || n.t;
  } else {
    tx.textContent=(n.ex?'★ ':'')+truncate(n.t, n.ex?10:12);
  }
  // 作者小字（非 hub）
  if(n.kind!=='hub' && n.a){
    const ta=document.createElementNS(NS,'text');
    ta.setAttribute('y', r+26);
    ta.setAttribute('text-anchor','middle');
    ta.setAttribute('font-size',9);
    ta.setAttribute('fill','#8a8074');
    ta.textContent=truncate(n.a,10);
    g.appendChild(ta);
  }
  g.appendChild(tx);

  n._g=g; n._c=c; n._tx=tx;

  g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
  svg.appendChild(g); nodeEls[n.id]=g;
});

// 定位
function render(){
  edgeEls.forEach(el=>{
    const a=byId[el.dataset.s], b=byId[el.dataset.t];
    el.setAttribute('x1',a.x); el.setAttribute('y1',a.y);
    el.setAttribute('x2',b.x); el.setAttribute('y2',b.y);
  });
  nodes.forEach(n=>{ n._g.setAttribute('transform',`translate(${n.x},${n.y})`); });
}
render();

// ---- 选择 / 高亮（核心交互：选中才画线）----
const panel=document.getElementById('panel');
function select(id){
  selected=id;
  const n=byId[id];
  const nb=adj[id]||[];
  const nbSet=new Set(nb.map(x=>x[0]));

  // 隐藏所有边
  edgeEls.forEach(el=>{ el.style.display='none'; });

  // 只显示当前节点的关联边
  nb.forEach(([tid,type])=>{
    edgeEls.forEach(el=>{
      if((el.dataset.s===id&&el.dataset.t===tid)||(el.dataset.s===tid&&el.dataset.t===id)){
        el.style.display='';
        el.classList.remove('dim');
      }
    });
  });

  // 节点高亮
  nodes.forEach(m=>{
    const g=m._g;
    if(m.id===id || nbSet.has(m.id)){
      g.classList.remove('dim');
      m._c.setAttribute('opacity',1);
    } else {
      g.classList.add('dim');
      m._c.setAttribute('opacity',0.15);
    }
  });

  // 书名：相关书和当前书显示
  nodes.forEach(m=>{
    if(m.kind==='hub') return;
    m._tx.setAttribute('opacity', (m.id===id||nbSet.has(m.id))?1:0.2);
  });

  // 面板（两级：卡片摘要 → 点「查看详情」展开完整内容）
  let h=`<h3>${esc(n.t)}</h3>`;
  h+=`<div class="meta">${esc(n.a||'')} ${n.c?'· '+esc(n.c):''}</div>`;
  if(n.note) h+=`<a class="note-link" href="${n.note}" target="_blank">★ 查看精读笔记 →</a>`;
  // 一级卡片：一句话定位
  h+=`<div class="card-pos">${esc(n.pos||'')}</div>`;
  // 二级详情按钮
  h+=`<button class="detail-btn" id="detailBtn">📖 查看详情 ↓</button>`;
  h+=`<div class="detail-box" id="detailBox">`;
  if(n.pts && n.pts.length){
    h+=`<span class="lbl">核心框架</span><ul>`;
    n.pts.forEach(p=>{ h+=`<li>${esc(p)}</li>`; });
    h+='</ul>';
  }
  if(n.who) h+=`<span class="lbl">适读人群</span><div class="who">${esc(n.who)}</div>`;
  h+='</div>';
  // 相关书籍
  h+=`<div class="rel-hint">${nb.length} 本相关书籍：</div><ul class="rel">`;
  nb.sort((a,b)=>(b[1]==='author')-(a[1]==='author'));
  nb.forEach(([tid,type])=>{
    const m=byId[tid];
    const tag=type==='author'
      ?'<span class="tag author">同作者</span>'
      :'<span class="tag cat">同分类</span>';
    h+=`<li data-go="${tid}">${tag}${esc(m.t)}<small style="color:var(--muted);margin-left:auto;font-size:11px;">${esc(m.a||'')}</small></li>`;
  });
  h+='</ul>';
  panel.innerHTML=h; panel.style.display='block';
  // 详情展开/收起
  const db=document.getElementById('detailBtn');
  const dbox=document.getElementById('detailBox');
  if(db) db.addEventListener('click',()=>{
    const open=dbox.classList.toggle('open');
    db.textContent = open ? '📖 收起详情 ↑' : '📖 查看详情 ↓';
  });

  panel.querySelectorAll('li[data-go]').forEach(li=>{
    li.addEventListener('click',()=>select(li.dataset.go));
  });
  svg.scrollIntoView({behavior:'smooth',block:'start'});
}

function clearSel(){
  selected=null;
  edgeEls.forEach(el=>{ el.style.display='none'; el.classList.remove('dim'); });
  nodes.forEach(m=>{
    m._g.classList.remove('dim');
    m._c.setAttribute('opacity', m.kind==='hub'?0.25:1);
    if(m.kind!=='hub') m._tx.setAttribute('opacity',1);
  });
  panel.style.display='none';
}
svg.addEventListener('click',clearSel);

// ---- 主题筛选 ----
const chipsBox=document.getElementById('chips');
Object.entries(clusters).forEach(([k,v])=>{
  const c=document.createElement('div'); c.className='chip'; c.dataset.k=k;
  c.innerHTML=`<span class="dot" style="background:${v.color}"></span>${v.name}`;
  c.addEventListener('click',()=>{
    if(activeClusters.has(k)){activeClusters.delete(k);c.classList.add('off');}
    else{activeClusters.add(k);c.classList.remove('off');}
    applyFilter();
  });
  chipsBox.appendChild(c);
});
function applyFilter(){
  nodes.forEach(n=>{
    n._g.style.display=activeClusters.has(n.cl)?'':'none';
  });
}
document.getElementById('reset').addEventListener('click',()=>{
  activeClusters=new Set(Object.keys(clusters));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('off'));
  clearSel(); applyFilter();
});
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase(); if(!q)return;
  const hit=nodes.find(n=>n.kind==='book'&&(
    n.t.toLowerCase().includes(q)||(n.a||'').toLowerCase().includes(q)));
  if(hit) select(hit.id);
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));}
</script>
</body>
</html>
