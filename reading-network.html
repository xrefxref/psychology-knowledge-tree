: [["hub_心理-心理学应用", "cat"]], "b_921073": [["hub_心理-心理学应用", "cat"]], "hub_人物传记-传记综合": [["b_3300007392", "cat"], ["b_25848978", "cat"], ["b_3300142877", "cat"], ["b_35634792", "cat"], ["b_25614391", "cat"]], "b_3300007392": [["hub_人物传记-传记综合", "cat"]], "b_25848978": [["hub_人物传记-传记综合", "cat"]], "b_3300142877": [["hub_人物传记-传记综合", "cat"]], "b_35634792": [["hub_人物传记-传记综合", "cat"], ["b_823432", "author"]], "b_25614391": [["hub_人物传记-传记综合", "cat"]], "b_3300200010": [["b_931853", "cat"], ["b_29313509", "cat"], ["b_3300171413", "author"], ["b_3300136405", "author"], ["b_3300159920", "author"]], "b_931853": [["b_3300200010", "cat"], ["b_29313509", "cat"]], "b_29313509": [["b_3300200010", "cat"], ["b_931853", "cat"]], "b_3300100349": [["b_857527", "cat"], ["b_3300149993", "cat"]], "b_857527": [["b_3300100349", "cat"], ["b_3300149993", "cat"]], "b_3300149993": [["b_3300100349", "cat"], ["b_857527", "cat"]], "b_635922": [["b_3300143092", "cat"], ["b_26934843", "cat"]], "b_3300143092": [["b_635922", "cat"], ["b_26934843", "cat"]], "b_26934843": [["b_635922", "cat"], ["b_3300143092", "cat"]], "b_3300217562": [["b_3300062106", "cat"]], "b_3300062106": [["b_3300217562", "cat"], ["b_43832746", "author"]], "b_3300207045": [["b_22649056", "cat"], ["b_42766048", "cat"]], "b_22649056": [["b_3300207045", "cat"], ["b_42766048", "cat"]], "b_42766048": [["b_3300207045", "cat"], ["b_22649056", "cat"]], "hub_心理-社会心理学": [["b_924592", "cat"], ["b_40958946", "cat"], ["b_3300126187", "cat"], ["b_3300065326", "cat"], ["b_3300079872", "cat"], ["b_3300034147", "cat"], ["b_32083597", "cat"], ["b_3300213521", "cat"], ["b_26955067", "cat"]], "b_924592": [["hub_心理-社会心理学", "cat"]], "b_40958946": [["hub_心理-社会心理学", "cat"], ["b_25812620", "author"], ["b_3300065326", "author"]], "b_3300126187": [["hub_心理-社会心理学", "cat"]], "b_3300065326": [["hub_心理-社会心理学", "cat"], ["b_25812620", "author"], ["b_40958946", "author"]], "b_3300079872": [["hub_心理-社会心理学", "cat"], ["b_627170", "author"], ["b_3300053160", "author"], ["b_41139991", "author"]], "b_3300034147": [["hub_心理-社会心理学", "cat"]], "b_32083597": [["hub_心理-社会心理学", "cat"]], "b_3300213521": [["hub_心理-社会心理学", "cat"], ["b_3300213548", "author"]], "b_26955067": [["hub_心理-社会心理学", "cat"], ["b_CB_5nCEz0EwN0LH74J75MGTd4L8", "author"]], "b_745216": [["b_25719921", "cat"]], "b_25719921": [["b_745216", "cat"]], "b_3300106073": [["b_3300217198", "cat"]], "b_3300217198": [["b_3300106073", "cat"]], "b_3300104552": [["b_3300136405", "cat"]], "b_3300136405": [["b_3300104552", "cat"], ["b_3300200010", "author"], ["b_3300171413", "author"], ["b_3300159920", "author"]], "b_3300159920": [["b_44171521", "cat"], ["b_3300200010", "author"], ["b_3300171413", "author"], ["b_3300136405", "author"]], "b_44171521": [["b_3300159920", "cat"]], "b_23355045": [["b_26541518", "author"]], "b_MP_WXS_3556016808": [["b_MP_WXS_3085758328", "author"]], "b_MP_WXS_3085758328": [["b_MP_WXS_3556016808", "author"]], "b_3300029527": [["b_23562650", "author"]], "b_CB_Gs1B0fAzm30373v75M46SFAf": [["b_CB_5nCA7aA4C3Gd73z75M9Fb9A4", "author"]], "b_CB_5nCA7aA4C3Gd73z75M9Fb9A4": [["b_CB_Gs1B0fAzm30373v75M46SFAf", "author"]], "b_CB_AT7AqD2npDFE6bj75F22B9d2": [["b_568791", "author"]], "b_CB_5nCEz0EwN0LH74J75MGTd4L8": [["b_26955067", "author"]]}, "exemplars": [["思考，快与慢", "thinking-fast-and-slow.html"], ["疯传", "contagious-book-notes.html"], ["传染", "invisible-influence-book-notes.html"]]};
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph');
const W=1200,H=840,CX=600,CY=420;
const nodes=DATA.nodes, edges=DATA.edges, clusters=DATA.clusters, centers=DATA.centers, adj=DATA.adj;
const show={cat:true,author:true};
let activeClusters=new Set(Object.keys(clusters));

// 初始化坐标：枢纽固定在主题中心，书在中心附近抖动
nodes.forEach(n=>{
  const c=centers[n.cl];
  if(n.kind==='hub'){ n.x=c.x; n.y=c.y; n.fixed=true; }
  else { n.x=c.x+(Math.random()-.5)*160; n.y=c.y+(Math.random()-.5)*160; }
  n.vx=0; n.vy=0;
});
const byId={}; nodes.forEach(n=>byId[n.id]=n);

// 力导布局（同步预热）
const REP=1500, SPRING=0.03, SLEN=48, GRAV=0.015, DAMP=0.85;
function tick(){
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    if(a.fixed) continue;
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<1)d2=1;
      const f=REP/d2; const d=Math.sqrt(d2);
      const fx=f*dx/d, fy=f*dy/d;
      if(!a.fixed){a.vx+=fx;a.vy+=fy;}
      if(!b.fixed){b.vx-=fx;b.vy-=fy;}
    }
  }
  edges.forEach(e=>{
    const a=byId[e.s], b=byId[e.t];
    let dx=b.x-a.x, dy=b.y-a.y; let d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=SPRING*(d-SLEN);
    const fx=f*dx/d, fy=f*dy/d;
    if(!a.fixed){a.vx+=fx;a.vy+=fy;}
    if(!b.fixed){b.vx-=fx;b.vy-=fy;}
  });
  nodes.forEach(n=>{
    if(n.fixed) return;
    const c=centers[n.cl];
    n.vx+=(c.x-n.x)*GRAV; n.vy+=(c.y-n.y)*GRAV;
    n.vx*=DAMP; n.vy*=DAMP;
    n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(20,Math.min(W-20,n.x));
    n.y=Math.max(20,Math.min(H-20,n.y));
  });
}
for(let i=0;i<320;i++) tick();

// 渲染
const edgeEls=[], nodeEls={};
function radius(n){
  if(n.kind==='hub') return 13;
  if(n.ex) return 11;
  return 4 + Math.min(n.deg,14)*0.55;
}
edges.forEach(e=>{
  const el=document.createElementNS(NS,'line');
  el.setAttribute('class','edge');
  const col = e.type==='author' ? '#c2912b' : (clusters[byId[e.s].cl].color);
  el.setAttribute('stroke', col);
  el.setAttribute('stroke-width', e.type==='author'?1.6:0.7);
  el.setAttribute('opacity', e.type==='author'?0.5:0.32);
  el.dataset.type=e.type; el.dataset.s=e.s; el.dataset.t=e.t;
  svg.appendChild(el); edgeEls.push(el);
});
nodes.forEach(n=>{
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','node'); g.dataset.id=n.id;
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('r', radius(n));
  c.setAttribute('fill', n.kind==='hub' ? '#fff' : clusters[n.cl].color);
  c.setAttribute('stroke', n.ex ? '#9a3b22' : (n.kind==='hub' ? clusters[n.cl].color : '#fff'));
  c.setAttribute('stroke-width', n.ex?2.5:1);
  g.appendChild(c);
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',0); tx.setAttribute('y', (radius(n)+11));
  tx.setAttribute('text-anchor','middle');
  tx.setAttribute('font-size', n.kind==='hub'?12:9);
  tx.setAttribute('fill', n.kind==='hub' ? clusters[n.cl].color : '#5a4f42');
  tx.setAttribute('opacity', n.kind==='hub'?1:0);
  tx.textContent = n.kind==='hub' ? n.t : (n.ex?'★ '+n.t : n.t);
  g.appendChild(tx);
  n._g=g; n._c=c; n._tx=tx;
  if(n.bId && n.bId.startsWith('http')===false && !n.note){}
  g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
  g.addEventListener('mouseenter',()=>{ if(!selected) tx.setAttribute('opacity',1); });
  g.addEventListener('mouseleave',()=>{ if(!selected) tx.setAttribute('opacity', n.kind==='hub'?1:0); });
  svg.appendChild(g); nodeEls[n.id]=g;
});
function render(){
  edgeEls.forEach(el=>{
    const a=byId[el.dataset.s], b=byId[el.dataset.t];
    el.setAttribute('x1',a.x); el.setAttribute('y1',a.y);
    el.setAttribute('x2',b.x); el.setAttribute('y2',b.y);
    const vis = (el.dataset.type==='cat' && show.cat) || (el.dataset.type==='author' && show.author);
    el.style.display = vis ? '' : 'none';
  });
  nodes.forEach(n=>{ n._g.setAttribute('transform',`translate(${n.x},${n.y})`); });
}

// 选择 / 高亮
let selected=null;
const panel=document.getElementById('panel');
function select(id){
  selected=id;
  const n=byId[id];
  const nb=adj[id]||[];
  const nbSet=new Set(nb.map(x=>x[0]));
  nodes.forEach(m=>{
    const g=m._g;
    if(m.id===id || nbSet.has(m.id)){ g.classList.remove('dim'); }
    else g.classList.add('dim');
  });
  edgeEls.forEach(el=>{
    const on = (el.dataset.s===id || el.dataset.t===id);
    el.classList.toggle('dim', !on);
    if(on) el.setAttribute('opacity', el.dataset.type==='author'?0.9:0.7);
  });
  // 标签：相关书也显示
  nodes.forEach(m=>{
    if(m.kind==='hub') return;
    m._tx.setAttribute('opacity', (m.id===id||nbSet.has(m.id))?1:0);
  });
  // 面板
  let html=`<h3>${esc(n.t)}</h3>`;
  html+=`<div class="meta">${esc(n.a||'')}${n.c?' · '+esc(n.c):''}</div>`;
  if(n.note) html+=`<div class="meta"><a class="back" style="margin:0" href="${n.note}" target="_blank">★ 查看精读笔记 →</a></div>`;
  html+=`<div class="hint">共 ${nb.length} 本相关书：</div><ul class="rel">`;
  nb.sort((a,b)=> (b[1]==='author')-(a[1]==='author'));
  nb.forEach(([tid,type])=>{
    const m=byId[tid];
    const tag = type==='author'?'<span class="tag author">同作者</span>':'<span class="tag cat">同分类</span>';
    html+=`<li data-go="${tid}">${tag}${esc(m.t)}</li>`;
  });
  html+='</ul>';
  panel.innerHTML=html; panel.style.display='block';
  panel.querySelectorAll('li[data-go]').forEach(li=>{
    li.addEventListener('click',()=>select(li.dataset.go));
  });
  // 缩放定位
  const sc=svg.viewBox.baseVal;
  const k=Math.min(sc.width/W, 1);
  svg.scrollIntoView({behavior:'smooth',block:'center'});
}
function clearSel(){
  selected=null;
  nodes.forEach(m=>{m._g.classList.remove('dim'); if(m.kind!=='hub')m._tx.setAttribute('opacity',0);});
  edgeEls.forEach(el=>{el.classList.remove('dim'); el.setAttribute('opacity', el.dataset.type==='author'?0.5:0.32);});
  panel.style.display='none';
}
svg.addEventListener('click',clearSel);

// 工具条：主题筛选 chips
const chipsBox=document.getElementById('chips');
Object.entries(clusters).forEach(([k,v])=>{
  const c=document.createElement('div'); c.className='chip'; c.dataset.k=k;
  c.innerHTML=`<span class="dot" style="background:${v.color}"></span>${v.name}`;
  c.addEventListener('click',()=>{
    if(activeClusters.has(k)){activeClusters.delete(k);c.classList.add('off');}
    else{activeClusters.add(k);c.classList.remove('off');}
    applyFilter();
  });
  chipsBox.appendChild(c);
});
function applyFilter(){
  nodes.forEach(n=>{
    const vis=activeClusters.has(n.cl);
    n._g.style.display=vis?'':'none';
  });
  edgeEls.forEach(el=>{
    const vis=activeClusters.has(byId[el.dataset.s].cl)&&activeClusters.has(byId[el.dataset.t].cl);
    if(!vis) el.style.display='none';
  });
}
document.getElementById('tCat').addEventListener('click',function(){show.cat=!show.cat;this.classList.toggle('active',!show.cat);render();});
document.getElementById('tAuth').addEventListener('click',function(){show.author=!show.author;this.classList.toggle('active',!show.author);render();});
document.getElementById('reset').addEventListener('click',()=>{
  activeClusters=new Set(Object.keys(clusters));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('off'));
  show.cat=true;show.author=true;
  document.getElementById('tCat').classList.remove('active');
  document.getElementById('tAuth').classList.remove('active');
  clearSel(); applyFilter(); render();
});
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase(); if(!q)return;
  const hit=nodes.find(n=>n.kind==='book'&&(n.t.toLowerCase().includes(q)||(n.a||'').toLowerCase().includes(q)));
  if(hit) select(hit.id);
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
render();
</script>
</body>
