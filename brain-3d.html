var brainParts = [];
var raycaster, mouse;
var isExploded = false;
var infoPanel = document.getElementById('infoPanel');
var tooltip = document.getElementById('tooltip');

  },

    functions: ['体温调节', '食欲控制', '睡眠周期', '激素分泌', '性行为'],
    phenomena: ['饥饿感', '渴感', '昼夜节律', '情绪反应'],

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 15;

  var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  var directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 5, 5);
  directionalLight.castShadow = true;
  scene.add(directionalLight);

  var pointLight = new THREE.PointLight(0x6366f1, 0.5);
  pointLight.position.set(-5, -5, 5);
  scene.add(pointLight);

  createBrainModel();

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('resize', onWindowResize);
  renderer.domElement.addEventListener('click', onMouseClick);
  renderer.domElement.addEventListener('mousemove', onMouseMove);

  animate();
}

function createBrainModel() {
  var materialParams = {
    shininess: 80,
    metalness: 0.1,
    roughness: 0.4,
    transparent: true,
    opacity: 0.9
  };

  var frontalMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0xef4444 });
  var parietalMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0xf59e0b });
  var temporalMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x8b5cf6 });
  var occipitalMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x10b981 });
  var cerebellumMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x3b82f6 });
  var brainstemMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x06b6d4 });
  var hippocampusMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0xec4899 });
  var amygdalaMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0xf97316 });
  var thalamusMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x84cc16 });
  var hypothalamusMaterial = new THREE.MeshStandardMaterial({ ...materialParams, color: 0x0ea5e9 });

  var frontalLobe = createFrontalLobe(frontalMaterial);
  var parietalLobe = createParietalLobe(parietalMaterial);
  var temporalLobe = createTemporalLobe(temporalMaterial);
  var occipitalLobe = createOccipitalLobe(occipitalMaterial);
  var cerebellum = createCerebellum(cerebellumMaterial);
  var brainstem = createBrainstem(brainstemMaterial);
  var hippocampus = createHippocampus(hippocampusMaterial);
  var amygdala = createAmygdala(amygdalaMaterial);
  var thalamus = createThalamus(thalamusMaterial);
  var hypothalamus = createHypothalamus(hypothalamusMaterial);

  var brainGroup = new THREE.Group();
  brainGroup.add(frontalLobe.mesh);
  brainGroup.add(parietalLobe.mesh);
  brainGroup.add(temporalLobe.mesh);
  brainGroup.add(occipitalLobe.mesh);
  brainGroup.add(cerebellum.mesh);
  brainGroup.add(brainstem.mesh);
  brainGroup.add(hippocampus.mesh);
  brainGroup.add(amygdala.mesh);
  brainGroup.add(thalamus.mesh);
  brainGroup.add(hypothalamus.mesh);

  scene.add(brainGroup);

  brainParts = [
    { mesh: frontalLobe.mesh, data: brainData.frontalLobe, offset: new THREE.Vector3(0, 0.8, 1.5) },
    { mesh: parietalLobe.mesh, data: brainData.parietalLobe, offset: new THREE.Vector3(0, 0.5, -0.5) },
    { mesh: temporalLobe.mesh, data: brainData.temporalLobe, offset: new THREE.Vector3(0, -0.5, -0.3) },
    { mesh: occipitalLobe.mesh, data: brainData.occipitalLobe, offset: new THREE.Vector3(0, 0, -2) },
    { mesh: cerebellum.mesh, data: brainData.cerebellum, offset: new THREE.Vector3(0, -1.2, -1.5) },
    { mesh: brainstem.mesh, data: brainData.brainstem, offset: new THREE.Vector3(0, -2, 0) },
    { mesh: hippocampus.mesh, data: brainData.hippocampus, offset: new THREE.Vector3(0, -0.3, -0.8) },
    { mesh: amygdala.mesh, data: brainData.amygdala, offset: new THREE.Vector3(0, -0.4, -0.5) },
    { mesh: thalamus.mesh, data: brainData.thalamus, offset: new THREE.Vector3(0, 0, 0.2) },
    { mesh: hypothalamus.mesh, data: brainData.hypothalamus, offset: new THREE.Vector3(0, -0.3, 0.3) }
  ];
}

function createFrontalLobe(material) {
  var geometry = new THREE.SphereGeometry(1.8, 32, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0.5, 1.2);
  mesh.scale.set(1.2, 0.9, 0.8);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'frontalLobe';
  return { mesh: mesh };
}

function createParietalLobe(material) {
  var geometry = new THREE.SphereGeometry(1.6, 32, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0.5, 0.2);
  mesh.scale.set(1.1, 0.8, 0.9);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'parietalLobe';
  return { mesh: mesh };
}

function createTemporalLobe(material) {
  var geometry = new THREE.SphereGeometry(1.4, 32, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, -0.6, 0.5);
  mesh.scale.set(1.2, 0.7, 0.8);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'temporalLobe';
  return { mesh: mesh };
}

function createOccipitalLobe(material) {
  var geometry = new THREE.SphereGeometry(1.2, 32, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0.2, -1.2);
  mesh.scale.set(0.9, 0.7, 0.8);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'occipitalLobe';
  return { mesh: mesh };
}

function createCerebellum(material) {
  var geometry = new THREE.SphereGeometry(1.0, 32, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, -1.5, -1.0);
  mesh.scale.set(0.8, 0.6, 0.7);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'cerebellum';
  return { mesh: mesh };
}

function createBrainstem(material) {
  var geometry = new THREE.CylinderGeometry(0.4, 0.5, 1.2, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, -2.2, 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'brainstem';
  return { mesh: mesh };
}

function createHippocampus(material) {
  var geometry = new THREE.TorusGeometry(0.4, 0.15, 16, 32);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, -0.5, -0.6);
  mesh.rotation.set(Math.PI / 2, 0, 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'hippocampus';
  return { mesh: mesh };
}

  var geometry = new THREE.SphereGeometry(0.3, 16, 16);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0.2, -0.5, -0.3);

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseClick(event) {
  event.preventDefault();
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  var meshes = brainParts.map(function(p) { return p.mesh; });
  var intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    var clickedMesh = intersects[0].object;
    var part = brainParts.find(function(p) { return p.mesh === clickedMesh; });
    if (part) {
      showInfoPanel(part.data);
    }
  } else {
    closeInfoPanel();
  }
}

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  var meshes = brainParts.map(function(p) { return p.mesh; });
  var intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    var hoveredMesh = intersects[0].object;
    var part = brainParts.find(function(p) { return p.mesh === hoveredMesh; });
    if (part) {
      tooltip.textContent = part.data.name;
      tooltip.style.left = (event.clientX + 15) + 'px';
      tooltip.style.top = (event.clientY - 25) + 'px';
      tooltip.classList.add('visible');
      document.body.style.cursor = 'pointer';
      hoveredMesh.material.emissive = new THREE.Color(0xffffff);
      hoveredMesh.material.emissiveIntensity = 0.2;
    }
  } else {
    tooltip.classList.remove('visible');
    document.body.style.cursor = 'default';
    brainParts.forEach(function(p) {
      p.mesh.material.emissive = new THREE.Color(0x000000);
      p.mesh.material.emissiveIntensity = 0;
    });
  }
}

function showInfoPanel(data) {
  document.getElementById('infoName').textContent = data.name;
  document.getElementById('infoColor').style.backgroundColor = '#' + data.color.toString(16).padStart(6, '0');
  document.getElementById('infoDescription').textContent = data.description;
  
  document.getElementById('infoFunctions').innerHTML = data.functions.map(function(f) {
    return '<li>' + f + '</li>';
  }).join('');
  
  document.getElementById('infoPhenomena').innerHTML = data.phenomena.map(function(p) {
    return '<li>' + p + '</li>';
  }).join('');
  
  document.getElementById('infoSymptoms').innerHTML = data.symptoms.map(function(s) {
    return '<li>' + s + '</li>';
  }).join('');

  infoPanel.style.display = 'block';
  makeDraggable(infoPanel);
}

function closeInfoPanel() {
  infoPanel.style.display = 'none';
}

function makeDraggable(element) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  
  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.classList.add('dragging');
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }
  
  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.style.top = (element.offsetTop - pos2) + 'px';
    element.style.left = (element.offsetLeft - pos1) + 'px';
  }
  
  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
    element.classList.remove('dragging');
  }
  
  element.onmousedown = dragMouseDown;
}

function explodeModel() {
  if (isExploded) return;
  isExploded = true;
  
  brainParts.forEach(function(part) {
    var targetPos = part.offset.clone().multiplyScalar(2);
    animateMesh(part.mesh, targetPos, 1000);
  });
}

function assembleModel() {
  if (!isExploded) return;
  isExploded = false;
  
  brainParts.forEach(function(part) {
    animateMesh(part.mesh, new THREE.Vector3(0, 0, 0), 1000);
  });
}

function animateMesh(mesh, targetPos, duration) {
  var startPos = mesh.position.clone();
  var startTime = Date.now();
  
  function animate() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / duration, 1);
    
    var eased = 1 - Math.pow(1 - progress, 3);
    
    mesh.position.lerpVectors(startPos, targetPos, eased);
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }
  
  animate();
}

function resetView() {
  controls.reset();
  assembleModel();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

document.getElementById('resetBtn').addEventListener('click', resetView);
document.getElementById('explodeBtn').addEventListener('click', explodeModel);
document.getElementById('assembleBtn').addEventListener('click', assembleModel);

init();
</script>
