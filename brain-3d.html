function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 20;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  var directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 8, 5);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 2048;
  directionalLight.shadow.mapSize.height = 2048;
  scene.add(directionalLight);

  var directionalLight2 = new THREE.DirectionalLight(0x6366f1, 0.4);
  directionalLight2.position.set(-5, -5, -5);
  scene.add(directionalLight2);

  var pointLight = new THREE.PointLight(0xffdab9, 0.6);
  pointLight.position.set(3, 3, -3);
  scene.add(pointLight);

  var hemisphereLight = new THREE.HemisphereLight(0x6366f1, 0x0f172a, 0.5);
  scene.add(hemisphereLight);

  brainGroup = new THREE.Group();
  scene.add(brainGroup);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('resize', onWindowResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onMouseClick);

  createRealisticBrain();
  animate();
}

function createRealisticBrain() {
  var brainMaterialParams = {
    shininess: 100,
    metalness: 0.05,
    roughness: 0.3,
    transparent: true,
    opacity: 0.92
  };

  var frontalMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0xef4444 });
  var parietalMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0xf59e0b });
  var temporalMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x8b5cf6 });
  var occipitalMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x10b981 });
  var cerebellumMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x3b82f6 });
  var brainstemMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x06b6d4 });
  var hippocampusMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0xec4899 });
  var amygdalaMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0xf97316 });
  var thalamusMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x84cc16 });
  var hypothalamusMaterial = new THREE.MeshStandardMaterial({ ...brainMaterialParams, color: 0x0ea5e9 });

  var frontalLobe = createRealisticFrontalLobe(frontalMaterial);
  var parietalLobe = createRealisticParietalLobe(parietalMaterial);
  var temporalLobe = createRealisticTemporalLobe(temporalMaterial);
  var occipitalLobe = createRealisticOccipitalLobe(occipitalMaterial);
  var cerebellum = createRealisticCerebellum(cerebellumMaterial);
  var brainstem = createRealisticBrainstem(brainstemMaterial);
  var hippocampus = createRealisticHippocampus(hippocampusMaterial);
  var amygdala = createRealisticAmygdala(amygdalaMaterial);
  var thalamus = createRealisticThalamus(thalamusMaterial);
  var hypothalamus = createRealisticHypothalamus(hypothalamusMaterial);

  brainGroup.add(frontalLobe.mesh);
  brainGroup.add(parietalLobe.mesh);
  brainGroup.add(temporalLobe.mesh);
  brainGroup.add(occipitalLobe.mesh);
  brainGroup.add(cerebellum.mesh);
  brainGroup.add(brainstem.mesh);
  brainGroup.add(hippocampus.mesh);
  brainGroup.add(amygdala.mesh);
  brainGroup.add(thalamus.mesh);
  brainGroup.add(hypothalamus.mesh);

  brainParts = [
    { mesh: frontalLobe.mesh, data: brainData.frontalLobe, offset: new THREE.Vector3(0, 0.6, 1.8) },
    { mesh: parietalLobe.mesh, data: brainData.parietalLobe, offset: new THREE.Vector3(0, 0.4, -0.3) },
    { mesh: temporalLobe.mesh, data: brainData.temporalLobe, offset: new THREE.Vector3(0.8, -0.6, 0.2) },
    { mesh: occipitalLobe.mesh, data: brainData.occipitalLobe, offset: new THREE.Vector3(0, 0.2, -2.2) },
    { mesh: cerebellum.mesh, data: brainData.cerebellum, offset: new THREE.Vector3(0, -1.5, -1.2) },
    { mesh: brainstem.mesh, data: brainData.brainstem, offset: new THREE.Vector3(0, -2.5, 0) },
    { mesh: hippocampus.mesh, data: brainData.hippocampus, offset: new THREE.Vector3(0.6, -0.4, -0.8) },
    { mesh: amygdala.mesh, data: brainData.amygdala, offset: new THREE.Vector3(0.5, -0.5, -0.3) },
    { mesh: thalamus.mesh, data: brainData.thalamus, offset: new THREE.Vector3(0, 0, 0.3) },
    { mesh: hypothalamus.mesh, data: brainData.hypothalamus, offset: new THREE.Vector3(0, -0.4, 0.4) }
  ];

  addBrainTextures();

  loading.style.display = 'none';
}

function addBrainTextures() {
  var textureLoader = new THREE.TextureLoader();
  
  textureLoader.load('https://threejs.org/examples/textures/noise.png', function(noiseTexture) {
    noiseTexture.wrapS = THREE.RepeatWrapping;
    noiseTexture.wrapT = THREE.RepeatWrapping;
    
    brainParts.forEach(function(part) {
      if (part.mesh.material) {
        part.mesh.material.bumpMap = noiseTexture;
        part.mesh.material.bumpScale = 0.05;
        part.mesh.material.needsUpdate = true;
      }
    });
  });
}

function createRealisticFrontalLobe(material) {
  var geometry = new THREE.SphereGeometry(2.2, 128, 128);
  var mesh = new THREE.Mesh(geometry, material);
  
  mesh.position.set(0, 0.3, 1.5);
  mesh.scale.set(1.15, 0.85, 0.75);
  
  var shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.quadraticCurveTo(2, 1, 2, 0);
  shape.quadraticCurveTo(2, -1, 0, 0);
  
  var extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelSegments: 2 };
  var gyriGeometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  
  for (var i = 0; i < 8; i++) {
    var gyri = new THREE.Mesh(gyriGeometry, material.clone());
    gyri.position.set(
      (Math.random() - 0.5) * 3,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 1 + 1.8
    );
    gyri.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    gyri.scale.set(0.3, 0.3, 0.3);
    mesh.add(gyri);
  }
  
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return { mesh: mesh };
}

function createRealisticParietalLobe(material) {
  var geometry = new THREE.SphereGeometry(1.8, 128, 128);

function createRealisticCerebellum(material) {
  var group = new THREE.Group();
  
  var mainGeometry = new THREE.SphereGeometry(1.1, 64, 64);
  var mainMesh = new THREE.Mesh(mainGeometry, material);
  mainMesh.position.set(0, -1.3, -1.0);
  mainMesh.scale.set(0.8, 0.55, 0.9);
  
  for (var i = 0; i < 6; i++) {
    var foliumGeometry = new THREE.BoxGeometry(0.8, 0.1, 0.3);
    var folium = new THREE.Mesh(foliumGeometry, material.clone());
    folium.position.set(0, -1.3 - i * 0.12, -0.8);
    folium.scale.set(0.9 - i * 0.1, 1, 1);
    group.add(folium);
  }
  
  group.add(mainMesh);
  group.castShadow = true;
  group.receiveShadow = true;
  return { mesh: group };
}

function createRealisticBrainstem(material) {

  mesh.position.set(0, -2.2, 0);

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  var meshes = [];
  brainParts.forEach(function(p) {
    p.mesh.traverse(function(child) {
      if (child.isMesh) meshes.push(child);
    });
  });
  
  var intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    var hoveredMesh = intersects[0].object;
    var part = findPartByMesh(hoveredMesh);
    
    if (part) {
      tooltip.textContent = part.data.name;
      tooltip.style.left = (event.clientX + 20) + 'px';
      tooltip.style.top = (event.clientY - 30) + 'px';
      tooltip.classList.add('visible');
      document.body.style.cursor = 'pointer';
      
      hoveredMesh.material.emissive = new THREE.Color(0xffffff);
      hoveredMesh.material.emissiveIntensity = 0.15;
    }
  } else {
    tooltip.classList.remove('visible');
    document.body.style.cursor = 'default';
    brainParts.forEach(function(p) {
      p.mesh.traverse(function(child) {
        if (child.isMesh && child.material) {
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 0;
        }
      });
    });
  }
}

function findPartByMesh(mesh) {
  for (var i = 0; i < brainParts.length; i++) {
    var found = false;
    brainParts[i].mesh.traverse(function(child) {
      if (child === mesh) found = true;
    });
    if (found) return brainParts[i];
  }
  return null;
}

function onMouseClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  var meshes = [];
  brainParts.forEach(function(p) {
    p.mesh.traverse(function(child) {
      if (child.isMesh) meshes.push(child);
    });
  });
  
  var intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    var clickedMesh = intersects[0].object;
    var part = findPartByMesh(clickedMesh);
    if (part) {
      showInfoPanel(part.data);
    }
  } else {
    closeInfoPanel();
  }
}

function showInfoPanel(data) {
  document.getElementById('infoName').textContent = data.name;
  document.getElementById('infoColor').style.backgroundColor = '#' + data.color.toString(16).padStart(6, '0');
  document.getElementById('infoColor').style.color = '#' + data.color.toString(16).padStart(6, '0');
  document.getElementById('infoDescription').textContent = data.description;
  
  document.getElementById('infoFunctions').innerHTML = data.functions.map(function(f) {
    return '<li>' + f + '</li>';
  }).join('');
  
  document.getElementById('infoPhenomena').innerHTML = data.phenomena.map(function(p) {
    return '<li>' + p + '</li>';
  }).join('');
  
  document.getElementById('infoSymptoms').innerHTML = data.symptoms.map(function(s) {
    return '<li>' + s + '</li>';
  }).join('');

  infoPanel.style.display = 'block';
  makeDraggable(infoPanel);
}

function closeInfoPanel() {
  infoPanel.style.display = 'none';
}

function makeDraggable(element) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  
  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.classList.add('dragging');
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }
  
  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.style.top = (element.offsetTop - pos2) + 'px';
    element.style.left = (element.offsetLeft - pos1) + 'px';
  }
  
  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
    element.classList.remove('dragging');
  }
  
  element.onmousedown = dragMouseDown;
}

function explodeModel() {
  if (isExploded) return;
  isExploded = true;
  
  brainParts.forEach(function(part) {
    var targetPos = part.offset.clone().multiplyScalar(2.5);
    animateMesh(part.mesh, targetPos, 1200);
  });
  
  controls.autoRotate = false;
}

function assembleModel() {
  if (!isExploded) return;
  isExploded = false;
  
  brainParts.forEach(function(part) {
    animateMesh(part.mesh, new THREE.Vector3(0, 0, 0), 1200);
  });
  
  controls.autoRotate = true;
}

function animateMesh(mesh, targetPos, duration) {
  var startPos = new THREE.Vector3();
  mesh.getWorldPosition(startPos);
  
  var startTime = Date.now();
  
  function animate() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / duration, 1);
    
    var eased = 1 - Math.pow(1 - progress, 4);
    
    var currentPos = new THREE.Vector3().lerpVectors(startPos, targetPos, eased);
    mesh.position.copy(currentPos);
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }
  
  animate();
}

function resetView() {
  controls.reset();
  controls.autoRotate = true;
  camera.position.set(0, 0, 8);
  assembleModel();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

document.getElementById('resetBtn').addEventListener('click', resetView);
document.getElementById('explodeBtn').addEventListener('click', explodeModel);
document.getElementById('assembleBtn').addEventListener('click', assembleModel);

init();
</script>
