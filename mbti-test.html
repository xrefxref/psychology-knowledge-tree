<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>职业性格测评 · 16 型人格职场倾向报告</title>
<meta name="description" content="48 道职场情境题，生成属于你的 64 型人格职业报告：工作画像、匹配职业、能量获取、决策方式、冲突应对与发展建议。">
<meta name="theme-color" content="#3D5AFE">
<style>
/* ==========================================================
   职业性格测评 · 样式表
   设计基调：蓝色专业报告风 / 移动优先 / 零外部依赖
   ========================================================== */

:root{
  --brand:#3D5AFE;
  --brand-2:#6285FF;
  --brand-deep:#2438B8;
  --brand-soft:#EEF2FF;
  --brand-line:#D9E2FB;
  --ink:#17233D;
  --ink-2:#4A5A78;
  --ink-3:#8A96AC;
  --line:#E7EDF9;
  --bg:#F4F7FE;
  --white:#FFFFFF;
  --radius:16px;
  --radius-sm:10px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --shadow:0 2px 12px rgba(45,70,160,.06);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.75;
  font-size:15px;
  overflow-x:hidden;
}

.app{max-width:720px;margin:0 auto;background:var(--white);min-height:100vh;position:relative}
@media(min-width:760px){
  body{background:#EDF2FC}
  .app{box-shadow:0 0 40px rgba(45,70,160,.08)}
}

.screen{display:none}
.screen.is-active{display:block;animation:screenIn .38s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ==================== 首页 ==================== */
#screen-home{
  background:linear-gradient(180deg,#F0F4FF 0%,#FFFFFF 62%);
  min-height:100vh;
}
.home-wrap{
  padding:64px 24px 48px;
  min-height:100vh;
  box-sizing:border-box;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.home-badge{
  display:inline-block;
  font-size:12px;letter-spacing:.08em;color:var(--brand);
  background:var(--white);border:1px solid var(--brand-line);
  padding:5px 14px;border-radius:999px;margin-bottom:22px;
}
.home-title{
  font-size:30px;font-weight:600;letter-spacing:.06em;
  color:var(--ink);line-height:1.35;
}
.home-title::after{
  content:"";display:block;width:52px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  margin:16px auto 0;
}
.home-sub{
  font-size:14px;color:var(--ink-2);margin-top:18px;max-width:19em;line-height:1.8;
}
.home-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  width:100%;margin:36px 0 40px;
}
.hc{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:16px 6px;display:flex;flex-direction:column;gap:2px;
}
.hc-num{font-size:23px;font-weight:600;color:var(--brand);line-height:1.2}
.hc-lbl{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}

.btn{
  font-family:var(--sans);font-size:15px;border:none;cursor:pointer;
  border-radius:999px;transition:transform .15s ease,box-shadow .2s ease,opacity .2s;
  -webkit-appearance:none;appearance:none;
}
.btn-primary{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  color:#fff;box-shadow:0 6px 18px rgba(61,90,254,.28);
}
.btn-primary:active{transform:translateY(1px) scale(.99)}
.btn-lg{width:100%;max-width:340px;padding:15px 0;font-weight:500;letter-spacing:.06em}

.home-tip{font-size:12.5px;color:var(--ink-3);margin-top:16px}
.btn-link{
  background:none;border:none;color:var(--brand);font-size:13.5px;
  font-family:var(--sans);cursor:pointer;margin-top:14px;text-decoration:underline;
  text-underline-offset:3px;
}
.home-note{
  margin-top:auto;padding-top:44px;font-size:11.5px;color:var(--ink-3);
  line-height:1.7;max-width:26em;
}

/* ==================== 测评页 ==================== */
#screen-quiz{padding-bottom:40px}
.quiz-head{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.quiz-back{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  border:1px solid var(--line);background:var(--white);color:var(--ink-2);
  font-size:16px;line-height:1;cursor:pointer;transition:background .2s;
}
.quiz-back:active{background:var(--brand-soft)}
.quiz-back:disabled{opacity:.3;cursor:default}
.quiz-progress{flex:1;height:6px;background:var(--brand-soft);border-radius:999px;overflow:hidden}
.quiz-progress-bar{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand));
  transition:width .32s cubic-bezier(.4,0,.2,1);
}
.quiz-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto}

.quiz-body{padding:44px 24px 0}
.quiz-index{
  font-size:12px;letter-spacing:.14em;color:var(--brand);
  font-weight:500;margin-bottom:14px;
}
.quiz-q{
  font-size:19.5px;font-weight:500;line-height:1.62;color:var(--ink);
  margin-bottom:34px;letter-spacing:.01em;
}
.quiz-opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  text-align:left;width:100%;cursor:pointer;
  background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:17px 18px;font-family:var(--sans);font-size:15px;line-height:1.62;
  color:var(--ink-2);transition:border-color .18s,background .18s,transform .12s;
}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--brand-line);background:#FBFCFE}
.opt.is-picked{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.opt-mark{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--brand-line);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
  transition:background .18s,border-color .18s;
}
.opt.is-picked .opt-mark{background:var(--brand);border-color:var(--brand)}

/* ==================== 计算页 ==================== */
#screen-calc{min-height:100vh;display:none}
#screen-calc.is-active{display:flex;align-items:center;justify-content:center}
.calc-wrap{text-align:center;padding:0 30px}
.calc-ring{
  width:56px;height:56px;border-radius:50%;margin:0 auto 26px;
  border:3px solid var(--brand-soft);border-top-color:var(--brand);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.calc-text{font-size:14px;color:var(--ink-2);letter-spacing:.02em;min-height:1.7em}

/* ==================== 报告页 ==================== */
#screen-report{background:linear-gradient(180deg,#EEF3FF 0%,#F8FAFF 340px,#F8FAFF 100%);padding-bottom:56px}

.report-hero{
  position:relative;text-align:center;padding:46px 24px 40px;
  background:linear-gradient(150deg,#5A7BFF 0%,#3D5AFE 55%,#2E45C8 100%);
  border-radius:0 0 26px 26px;overflow:hidden;
}
.report-hero::before,
.report-hero::after{
  content:"";position:absolute;border-radius:50%;
  background:rgba(255,255,255,.09);
}
.report-hero::before{width:190px;height:190px;top:-80px;left:-58px}
.report-hero::after{width:120px;height:120px;bottom:-54px;right:-30px}
.hero-label{
  position:relative;font-size:12px;letter-spacing:.22em;
  color:rgba(255,255,255,.75);margin-bottom:14px;
}
.hero-code{
  position:relative;font-size:52px;font-weight:600;letter-spacing:.08em;
  color:#fff;line-height:1.1;font-variant-numeric:tabular-nums;
}
.hero-name{
  position:relative;font-size:19px;color:#fff;margin-top:12px;letter-spacing:.05em;
}
.hero-name em{
  font-style:normal;color:#FFD98A;font-weight:500;
}
.hero-handle{
  position:relative;display:inline-block;margin-top:16px;
  font-size:12.5px;color:rgba(255,255,255,.86);
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  padding:5px 14px;border-radius:999px;letter-spacing:.03em;
}
.hero-slogan{
  position:relative;font-size:14px;color:rgba(255,255,255,.9);
  margin-top:20px;line-height:1.8;max-width:22em;margin-left:auto;margin-right:auto;
}
.hero-meta{
  position:relative;display:flex;justify-content:center;gap:26px;
  margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2);
}
.hero-meta div{text-align:center}
.hero-meta b{display:block;font-size:17px;font-weight:500;color:#fff}
.hero-meta span{font-size:11.5px;color:rgba(255,255,255,.7)}

.report-body{padding:26px 18px 0}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px 20px 26px;margin-bottom:18px;box-shadow:var(--shadow);
  position:relative;
}
.card-label{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  color:#fff;font-size:14px;font-weight:500;letter-spacing:.06em;
  padding:5px 30px;border-radius:8px;white-space:nowrap;
  box-shadow:0 4px 12px rgba(61,90,254,.22);
}
.card-label-plain{
  position:static;transform:none;display:inline-block;
  padding:4px 16px;font-size:12.5px;box-shadow:none;margin-bottom:16px;
}

.sec-title{
  font-size:15px;font-weight:500;color:var(--ink);
  letter-spacing:.04em;margin:26px 0 12px;
  display:flex;align-items:center;gap:9px;
}
.sec-title::before{
  content:"";width:3px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));
  flex:0 0 3px;
}
.sec-title:first-child{margin-top:0}

.chapter{
  text-align:center;font-size:16px;font-weight:500;color:var(--ink);
  letter-spacing:.1em;margin:0 0 24px;padding:0 6px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.chapter::before,.chapter::after{
  content:"";height:1px;flex:1;max-width:56px;
  background:linear-gradient(90deg,transparent,var(--brand-line));
}
.chapter::after{background:linear-gradient(90deg,var(--brand-line),transparent)}

.num-title{
  display:flex;align-items:baseline;gap:8px;
  font-size:15px;font-weight:500;color:var(--ink);margin-bottom:12px;
}
.num-title i{
  font-style:normal;color:var(--brand);font-weight:600;font-size:14px;
  font-variant-numeric:tabular-nums;
}

p.body{font-size:14.5px;color:var(--ink-2);line-height:1.92;margin-bottom:12px}
p.body:last-child{margin-bottom:0}
p.body strong{color:var(--ink);font-weight:500}

.quote{
  border-left:3px solid var(--brand-line);background:var(--brand-soft);
  padding:14px 16px;border-radius:0 10px 10px 0;
  font-size:13.5px;color:var(--brand-deep);line-height:1.85;margin:16px 0;
}

/* --- 四维度条 --- */
.dims{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.dim{}
.dim-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--ink-2);margin-bottom:7px;
}
.dim-head b{font-weight:500;color:var(--ink);font-size:14px}
.dim-head .dim-pct{color:var(--brand);font-variant-numeric:tabular-nums;font-size:12.5px}
.dim-track{
  height:8px;background:var(--brand-soft);border-radius:999px;overflow:hidden;
}
.dim-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand));
  transition:width .9s cubic-bezier(.4,0,.2,1);
}

/* --- 六维柱状图 --- */
.chart{
  position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:6px;height:226px;margin:18px 0 6px;padding:0 2px;
}
.chart-grid{
  position:absolute;left:2px;right:2px;bottom:67px;height:132px;
  background-image:repeating-linear-gradient(to top,rgba(45,70,160,.1) 0 1px,transparent 1px 26.4px);
  background-size:100% 132px;background-repeat:no-repeat;
  pointer-events:none;
}
.chart-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  height:100%;justify-content:flex-end;min-width:0;
}
.chart-val{
  font-size:11.5px;color:var(--brand);font-variant-numeric:tabular-nums;
  margin-bottom:5px;font-weight:500;
}
.chart-bar{
  width:100%;max-width:20px;height:0;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,#8FA8FF,#3D5AFE);
  transition:height 1s cubic-bezier(.34,1.1,.5,1);
}
.chart-lbl{
  font-size:11.5px;color:var(--ink-3);margin-top:9px;
  writing-mode:vertical-rl;text-orientation:upright;
  letter-spacing:.12em;height:58px;line-height:1.1;
}
.chart-lbl.is-top{color:var(--brand);font-weight:500}

.legend{
  display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--ink-3);
}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{
  width:10px;height:10px;border-radius:3px;display:block;flex:0 0 10px;
}
.legend i.lg-a{background:linear-gradient(180deg,#8FA8FF,#3D5AFE)}
.legend i.lg-b{background:#DDE5F8}

/* --- 职业卡 --- */
.jobs{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.job{
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  background:#FCFDFF;
}
.job-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.job-name{font-size:14.5px;font-weight:500;color:var(--ink)}
.job-fit{
  font-size:11px;color:var(--brand);background:var(--brand-soft);
  padding:2px 8px;border-radius:999px;flex:0 0 auto;letter-spacing:.03em;
}
.job-why{font-size:13px;color:var(--ink-2);line-height:1.8;margin-top:6px}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{
  font-size:12px;color:var(--brand-deep);background:var(--brand-soft);
  border:1px solid var(--brand-line);padding:4px 12px;border-radius:999px;
}

/* --- 优势 / 盲点 --- */
.two-col{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
@media(min-width:600px){.two-col{grid-template-columns:1fr 1fr}}
.list-box{border-radius:12px;padding:16px 16px 14px}
.list-box.good{background:#F0F7F2;border:1px solid #D6E9DD}
.list-box.warn{background:#FDF6EC;border:1px solid #F2E2C8}
.list-box h4{font-size:13.5px;font-weight:500;margin-bottom:10px;letter-spacing:.03em}
.list-box.good h4{color:#256B45}
.list-box.warn h4{color:#8A5A12}
.list-box ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.list-box li{
  font-size:13px;color:var(--ink-2);line-height:1.78;
  padding-left:14px;position:relative;
}
.list-box li::before{
  content:"";position:absolute;left:0;top:9px;
  width:5px;height:5px;border-radius:50%;
}
.list-box.good li::before{background:#4E9C6E}
.list-box.warn li::before{background:#D69A3C}

/* --- 建议 --- */
.steps{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.step{display:flex;gap:12px;align-items:flex-start}
.step-no{
  flex:0 0 24px;width:24px;height:24px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  margin-top:3px;font-variant-numeric:tabular-nums;
}
.step-txt{font-size:14px;color:var(--ink-2);line-height:1.85}
.step-txt b{color:var(--ink);font-weight:500}

/* --- 冲突章节插画位 --- */
.illus{
  margin:16px 0 4px;border-radius:14px;overflow:hidden;
  background:linear-gradient(160deg,#F2F6FF,#E5EDFF);
  display:flex;align-items:center;justify-content:center;
  padding:22px 16px;
}
.illus svg{width:100%;max-width:290px;height:auto;display:block}

/* --- 报告底部 --- */
.report-actions{
  display:flex;flex-direction:column;gap:12px;
  padding:14px 6px 0;
}
.btn-ghost{
  background:var(--white);border:1px solid var(--brand-line);color:var(--brand);
  padding:14px 0;width:100%;font-weight:500;letter-spacing:.05em;
}
.report-foot{
  text-align:center;font-size:11.5px;color:var(--ink-3);
  line-height:1.8;padding:30px 20px 0;
}

.fade-up{animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media(max-width:360px){
  .home-title{font-size:26px}
  .hero-code{font-size:42px}
  .quiz-q{font-size:18px}
  .card{padding:28px 15px 22px}
  .report-body{padding:26px 12px 0}
  .chart-lbl{height:54px;font-size:11px}
}

.site-back{position:absolute;top:16px;left:16px;z-index:5;font-size:12.5px;color:#4A5A78;text-decoration:none;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid #E7EDF9;box-shadow:0 1px 6px rgba(45,70,160,.06)}
.site-back:hover{color:#3D5AFE;border-color:#D9E2FB}
.home-wrap{position:relative}

</style>
</head>
<body>
<div class="app">

  <!-- ==================== 首页 ==================== -->
  <section class="screen is-active" id="screen-home">
    <div class="home-wrap">
      <a class="site-back" href="index.html">&#8592; 返回心理学全景学习</a>
      <div class="home-badge">基于荣格心理类型理论 · 职场场景版</div>
      <h1 class="home-title">职业性格测评</h1>
      <p class="home-sub">48 道职场情境题，生成属于你的 64 型人格职业报告</p>

      <div class="home-cards">
        <div class="hc"><span class="hc-num">64</span><span class="hc-lbl">型人格细分</span></div>
        <div class="hc"><span class="hc-num">48</span><span class="hc-lbl">道情境题</span></div>
        <div class="hc"><span class="hc-num">7</span><span class="hc-lbl">章深度报告</span></div>
      </div>

      <button class="btn btn-primary btn-lg" id="btn-start">开始测评</button>
      <p class="home-tip">约需 8 分钟 · 无需注册 · 结果仅保存在本机</p>
      <button class="btn-link" id="btn-resume" hidden>继续上次未完成的测评</button>

      <div class="home-note">
        本测评为职业发展参考工具，不构成心理诊断，也不应作为招聘、录用或人事决策依据。
      </div>
    </div>
  </section>

  <!-- ==================== 测评 ==================== -->
  <section class="screen" id="screen-quiz">
    <header class="quiz-head">
      <button class="quiz-back" id="btn-quiz-back" aria-label="返回上一题">&#8592;</button>
      <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-bar"></div></div>
      <span class="quiz-count" id="quiz-count">1 / 48</span>
    </header>
    <div class="quiz-body">
      <p class="quiz-index" id="quiz-index">第 1 题</p>
      <h2 class="quiz-q" id="quiz-q"></h2>
      <div class="quiz-opts" id="quiz-opts"></div>
    </div>
  </section>

  <!-- ==================== 计算 ==================== -->
  <section class="screen" id="screen-calc">
    <div class="calc-wrap">
      <div class="calc-ring"></div>
      <p class="calc-text" id="calc-text">正在分析你的回答…</p>
    </div>
  </section>

  <!-- ==================== 报告 ==================== -->
  <section class="screen" id="screen-report">
    <div id="report-root"></div>
  </section>

</div>
<script>
/* ==========================================================
   职业性格测评 · 数据层
   结构：DIMS 四维度 / ROLES 四种职场取向 / QUESTIONS 题库 / TYPES 型格文案
   模型：16 型人格（四维度）× 4 种职场取向 = 64 型
   ========================================================== */

/* ---------------- 四维度定义 ---------------- */

<script>
/* ==========================================================
   职业性格测评 · 应用逻辑（零依赖）
   ========================================================== */

(function () {
  "use strict";

  var LS_KEY = "career-mbti-v1";
  var ORDER = ["A", "D", "H", "X"];

  var el = {
    screens: {
      home: document.getElementById("screen-home"),
      quiz: document.getElementById("screen-quiz"),
      calc: document.getElementById("screen-calc"),
      report: document.getElementById("screen-report")
    },
    bar: document.getElementById("quiz-bar"),
    count: document.getElementById("quiz-count"),
    qIndex: document.getElementById("quiz-index"),
    qText: document.getElementById("quiz-q"),
    qOpts: document.getElementById("quiz-opts"),
    back: document.getElementById("btn-quiz-back"),
    start: document.getElementById("btn-start"),
    resume: document.getElementById("btn-resume"),
    calcText: document.getElementById("calc-text"),
    reportRoot: document.getElementById("report-root")
  };

  var answers = new Array(QUESTIONS.length).fill(null);
  var idx = 0;
  var lastResult = null;

  /* ---------------- 工具 ---------------- */
  function show(name) {
    Object.keys(el.screens).forEach(function (k) {
      el.screens[k].classList.toggle("is-active", k === name);
    });
    window.scrollTo(0, 0);
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ answers: answers, idx: idx }));
    } catch (e) { /* 隐私模式忽略 */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.answers) || d.answers.length !== QUESTIONS.length) return null;
      return d;
    } catch (e) { return null; }
  }

  function clearSave() {
    try { localStorage.removeItem(LS_KEY); } catch (e) { }
  }

  /* ---------------- 测评流程 ---------------- */
  function renderQuestion() {
    var q = QUESTIONS[idx];
    el.bar.style.width = ((idx / QUESTIONS.length) * 100) + "%";
    el.count.textContent = (idx + 1) + " / " + QUESTIONS.length;
    el.qIndex.textContent = "第 " + (idx + 1) + " 题";
    el.qText.textContent = q.q;
    el.back.disabled = idx === 0;

    var cur = answers[idx];
    el.qOpts.innerHTML =
      optHTML("A", q.A, cur === "A") +
      optHTML("B", q.B, cur === "B");

    Array.prototype.forEach.call(el.qOpts.querySelectorAll(".opt"), function (node) {
      node.addEventListener("click", function () {
        answers[idx] = node.getAttribute("data-v");
        Array.prototype.forEach.call(el.qOpts.querySelectorAll(".opt"), function (n) {
          n.classList.toggle("is-picked", n === node);
        });
        save();
        setTimeout(function () {
          if (idx < QUESTIONS.length - 1) {
            idx++;
            renderQuestion();
          } else {
            finish();
          }
        }, 190);
      });
    });
  }

  function optHTML(v, text, picked) {
    return '<button type="button" class="opt' + (picked ? " is-picked" : "") + '" data-v="' + v + '">' +
      '<span class="opt-mark">' + (picked ? "&#10003;" : "") + '</span>' +
      '<span>' + esc(text) + '</span></button>';
  }

  function finish() {
    el.bar.style.width = "100%";
    show("calc");
    var msgs = [
      "正在统计你的回答…",
      "正在匹配 64 型人格模型…",
      "正在生成职业画像…",
      "报告已生成"
    ];
    var i = 0;
    el.calcText.textContent = msgs[0];
    var timer = setInterval(function () {
      i++;
      if (i < msgs.length) {
        el.calcText.textContent = msgs[i];
      } else {
        clearInterval(timer);
        lastResult = compute(answers);
        renderReport(lastResult);
        clearSave();
        show("report");
      }
    }, 620);
  }

  /* ---------------- 计分 ---------------- */
  function compute(ans) {
    var cnt = {
      EI: { E: 0, I: 0 },
      SN: { S: 0, N: 0 },
      TF: { T: 0, F: 0 },
      JP: { J: 0, P: 0 }
    };
    var rc = { A: 0, D: 0, H: 0, X: 0 };

    QUESTIONS.forEach(function (q, i) {
      var a = ans[i];
      if (!a) return;
      var v = a === "A" ? q.vA : q.vB;
      if (q.d === "RL") { rc[v] = (rc[v] || 0) + 1; }
      else { cnt[q.d][v] = (cnt[q.d][v] || 0) + 1; }
    });

    function resolve(key, sideA, sideB, dimName) {
      var a = cnt[key][sideA], b = cnt[key][sideB];
      var total = a + b || 1;
      var pa = Math.round((a / total) * 100);
      var lead = pa >= 50 ? sideA : sideB;
      return {
        name: dimName,
        lead: lead,
        pctA: pa,
        pctB: 100 - pa,
        strength: Math.max(pa, 100 - pa),
        leftLabel: DIMS[key].poleA.t,
        rightLabel: DIMS[key].poleB.t,
        leftKey: DIMS[key].poleA.k,
        rightKey: DIMS[key].poleB.k
      };
    }

    var d = {
      EI: resolve("EI", "E", "I", DIMS.EI.name),
      SN: resolve("SN", "S", "N", DIMS.SN.name),
      TF: resolve("TF", "T", "F", DIMS.TF.name),
      JP: resolve("JP", "J", "P", DIMS.JP.name)
    };

    var code = d.EI.lead + d.SN.lead + d.TF.lead + d.JP.lead;

    var best = ORDER[0], bestScore = -1;
    ORDER.forEach(function (k) {
      var s = rc[k] || 0;
      if (s > bestScore) { bestScore = s; best = k; }
    });

    return { code: code, dims: d, role: best, roleScores: rc };
  }

  /* ---------------- 报告渲染 ---------------- */
  function dimBars(r) {
    return ["EI", "SN", "TF", "JP"].map(function (k) {
      var d = r.dims[k];
      var isLeft = d.lead === d.leftKey;
      var pct = isLeft ? d.pctA : d.pctB;
      var label = isLeft ? d.leftLabel : d.rightLabel;
      return '' +
        '<div class="dim">' +
        '<div class="dim-head"><b>' + esc(label) + ' · ' + esc(d.lead) + '</b>' +
        '<span class="dim-pct">强度 ' + pct + '%</span></div>' +
        '<div class="dim-track"><div class="dim-fill" data-w="' + pct + '"></div></div>' +
        '</div>';
    }).join("");
  }

  function chartHTML(r) {
    var seq = ["EI", "SN", "TF", "JP"];
    var out = [];
    seq.forEach(function (k) {
      var d = r.dims[k];
      [
        { lb: d.leftLabel, v: d.pctA, lead: d.lead === d.leftKey },
        { lb: d.rightLabel, v: d.pctB, lead: d.lead === d.rightKey }
      ].forEach(function (it) {
        var h = Math.max(6, Math.round(it.v * 1.32));
        out.push(
          '<div class="chart-col">' +
          '<span class="chart-val">' + it.v + '</span>' +
          '<div class="chart-bar" data-h="' + h + '"></div>' +
          '<span class="chart-lbl' + (it.lead ? " is-top" : "") + '">' + esc(it.lb) + '</span>' +
          '</div>'
        );
      });
    });
    return out.join("");
  }

  function jobListHTML(code, roleKey) {
    var t = TYPES[code], role = ROLES[roleKey];
    var extra = role.jobsExtra.map(function (n, i) {
      return { n: n, f: 95 - i * 2, w: "叠加你的" + role.name + "取向后，这类岗位的匹配度进一步上升。", hot: true };
    });
    var base = t.jobs.slice(0, 5);
    return extra.concat(base).sort(function (a, b) { return b.f - a.f; }).map(function (j) {
      return '' +
        '<div class="job">' +
        '<div class="job-top"><span class="job-name">' + esc(j.n) + '</span>' +
        '<span class="job-fit">' + (j.hot ? "取向高匹配 " : "匹配度 ") + j.f + '%</span></div>' +
        '<p class="job-why">' + esc(j.w) + '</p>' +
        '</div>';
    }).join("");
  }

  function conflictIllus() {
    return '' +
      '<svg viewBox="0 0 280 152" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<ellipse cx="140" cy="138" rx="98" ry="8" fill="#DCE6FB"/>' +
      '<circle cx="84" cy="52" r="17" fill="#3D5AFE"/>' +
      '<path d="M60 136v-32a24 24 0 0 1 48 0v32z" fill="#5B7CFA"/>' +
      '<path d="M108 92q20-8 32-20" stroke="#5B7CFA" stroke-width="9" fill="none" stroke-linecap="round"/>' +
      '<circle cx="148" cy="70" r="6" fill="#8FA8FF"/>' +
      '<rect x="152" y="98" width="92" height="9" rx="4.5" fill="#8FA8FF"/>' +
      '<rect x="162" y="107" width="7" height="29" rx="3" fill="#B9C8F0"/>' +
      '<rect x="224" y="107" width="7" height="29" rx="3" fill="#B9C8F0"/>' +
      '<rect x="170" y="84" width="52" height="14" rx="3" fill="#FFC978"/>' +
      '<circle cx="196" cy="36" r="17" fill="#EEF2FF"/>' +
      '<text x="196" y="43" font-size="17" font-weight="500" text-anchor="middle" fill="#3D5AFE" font-family="sans-serif">?</text>' +
      '<circle cx="236" cy="56" r="12" fill="#FFF0DC"/>' +
      '<path d="M232 52h8M232 57h8M232 62h5" stroke="#E09B3D" stroke-width="1.6" stroke-linecap="round"/>' +
      '<circle cx="162" cy="52" r="9" fill="#E6F0FF"/>' +
      '<circle cx="162" cy="52" r="3.4" fill="#8FA8FF"/>' +
      '<circle cx="162" cy="52" r="7" fill="none" stroke="#8FA8FF" stroke-width="1.6"/>' +
      '<path d="M162 62l-4 8h8z" fill="#B9C8F0"/>' +
      '</svg>';
  }

  function renderReport(r) {
    var t = TYPES[r.code];
    var role = ROLES[r.role];
    var d = r.dims;
    var meta = [
      [DIMS.EI.name, d.EI.strength + "%"],
      [DIMS.SN.name, d.SN.strength + "%"],
      [DIMS.TF.name, d.TF.strength + "%"],
      [DIMS.JP.name, d.JP.strength + "%"]
    ];

    var html = '' +
      '<div class="report-hero">' +
        '<p class="hero-label">你的职业性格类型</p>' +
        '<p class="hero-code">' + r.code + '</p>' +
        '<p class="hero-name">' + esc(t.name) + ' · <em>' + esc(role.name) + '</em></p>' +
        '<span class="hero-handle">' + esc(role.slogan) + '</span>' +
        '<p class="hero-slogan">' + esc(t.slogan) + '</p>' +
        '<div class="hero-meta">' +
          meta.map(function (m) {
            return '<div><b>' + m[1] + '</b><span>' + m[0] + '</span></div>';
          }).join("") +
        '</div>' +
      '</div>' +

      '<div class="report-body">' +

        '<div class="card">' +
          '<span class="card-label">你的性格类型</span>' +
          '<div class="dims">' + dimBars(r) + '</div>' +
          '<div class="sec-title">工作画像</div>' +
          '<p class="body">' + esc(t.portrait) + '</p>' +
          '<div class="tags">' + t.tags.map(function (x) {
            return '<span class="tag">' + esc(x) + '</span>';
          }).join("") + '</div>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label">你的职场取向</span>' +
          '<div class="sec-title">' + esc(role.name) + ' · ' + esc(role.en) + '</div>' +
          '<p class="body">' + esc(role.one) + '</p>' +
          '<div class="sec-title">工作方式</div>' +
          '<p class="body">' + esc(role.work) + '</p>' +
          '<div class="sec-title">协作风格</div>' +
          '<p class="body">' + esc(role.collab) + '</p>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label">你适合什么职业</span>' +
          '<div class="jobs">' + jobListHTML(r.code, r.role) + '</div>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label card-label-plain">第三章：深度解锁</span>' +
          '<div class="num-title"><i>1.</i><span>能量与节奏</span></div>' +
          '<div class="chart"><div class="chart-grid"></div>' + chartHTML(r) + '</div>' +
          '<div class="legend">' +
            '<span><i class="lg-a"></i>深色为你的偏好侧</span>' +
            '<span>同一组两项合计 100</span>' +
          '</div>' +
          '<div class="sec-title">能量来源</div>' +
          '<p class="body">' + esc(t.energy) + '</p>' +
          '<div class="num-title" style="margin-top:22px"><i>2.</i><span>信息处理</span></div>' +
          '<p class="body">' + esc(t.info) + '</p>' +
          '<div class="num-title" style="margin-top:22px"><i>3.</i><span>决策方式</span></div>' +
          '<p class="body">' + esc(t.decide) + '</p>' +
          '<div class="num-title" style="margin-top:22px"><i>4.</i><span>工作节奏</span></div>' +
          '<p class="body">' + esc(t.pace) + '</p>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label card-label-plain">第四章：人际关系</span>' +
          '<div class="chapter">存在的冲突与危机</div>' +
          '<p class="body">' + esc(t.conflict) + '</p>' +
          '<div class="quote">' + esc(t.conflictTip) + '</div>' +
          '<div class="sec-title">这种取向容易踩的坑</div>' +
          '<p class="body">' + esc(role.risk) + '</p>' +
          '<div class="illus">' + conflictIllus() + '</div>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label">优势与盲点</span>' +
          '<div class="two-col">' +
            '<div class="list-box good"><h4>你的优势</h4><ul>' +
              t.strengths.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
            '</ul></div>' +
            '<div class="list-box warn"><h4>需要留意</h4><ul>' +
              t.blindspots.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
            '</ul></div>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<span class="card-label">发展建议</span>' +
          '<div class="steps">' +
            t.advice.map(function (x, i) {
              return '<div class="step"><span class="step-no">' + (i + 1) + '</span>' +
                '<span class="step-txt">' + esc(x) + '</span></div>';
            }).join("") +
          '</div>' +
        '</div>' +

        '<div class="report-actions">' +
          '<button class="btn btn-primary" id="btn-retake">重新测评</button>' +
          '<button class="btn btn-ghost" id="btn-copy">复制我的类型结果</button>' +
        '</div>' +

        '<p class="report-foot">' +
          '本报告基于 ' + r.code + ' 四维度倾向与「' + role.name + '」职场取向的组合推演生成，<br>' +
          '属于职业发展的参考视角，不构成心理诊断，也不应作为招聘或人事决策依据。' +
        '</p>' +

      '</div>';

    el.reportRoot.innerHTML = html;

    // 入场动画：维度条与柱状图
    requestAnimationFrame(function () {
      setTimeout(function () {
        Array.prototype.forEach.call(el.reportRoot.querySelectorAll(".dim-fill"), function (n) {
          n.style.width = n.getAttribute("data-w") + "%";
        });
        Array.prototype.forEach.call(el.reportRoot.querySelectorAll(".chart-bar"), function (n) {
          n.style.height = n.getAttribute("data-h") + "px";
        });
        Array.prototype.forEach.call(el.reportRoot.querySelectorAll(".card, .report-actions"), function (n, i) {
          n.classList.add("fade-up");
          n.style.animationDelay = Math.min(i * 45, 320) + "ms";
        });
      }, 60);
    });

    document.getElementById("btn-retake").addEventListener("click", function () {
      answers = new Array(QUESTIONS.length).fill(null);
      idx = 0;
      lastResult = null;
      clearSave();
      show("home");
      refreshResume();
    });

    document.getElementById("btn-copy").addEventListener("click", function (e) {
      var txt = "我的职业性格类型：" + r.code + "（" + t.name + "）· 职场取向：" + role.name + " " + role.slogan;
      var btn = e.currentTarget;
      var done = function () {
        btn.textContent = "已复制到剪贴板";
        setTimeout(function () { btn.textContent = "复制我的类型结果"; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) { }
        document.body.removeChild(ta);
        done();
      }
    });
  }

  /* ---------------- 首页与入口 ---------------- */
  function refreshResume() {
    var d = load();
    var done = d ? d.answers.filter(function (x) { return x; }).length : 0;
    if (d && done > 0 && done < QUESTIONS.length) {
      el.resume.hidden = false;
      el.resume.textContent = "继续上次未完成的测评（已完成 " + done + " / " + QUESTIONS.length + "）";
    } else {
      el.resume.hidden = true;
    }
  }

  el.start.addEventListener("click", function () {
    var d = load();
    var had = d ? d.answers.filter(function (x) { return x; }).length : 0;
    if (had > 0 && had < QUESTIONS.length && !window.confirm("上一次的测评尚未完成，是否从头开始？")) {
      return;
    }
    answers = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    clearSave();
    renderQuestion();
    show("quiz");
  });

  el.resume.addEventListener("click", function () {
    var d = load();
    if (!d) return;
    answers = d.answers.slice();
    idx = Math.min(d.idx || 0, QUESTIONS.length - 1);
    while (idx < QUESTIONS.length - 1 && answers[idx]) idx++;
    renderQuestion();
    show("quiz");
  });

  el.back.addEventListener("click", function () {
    if (idx > 0) {
      idx--;
      renderQuestion();
    }
  });

  refreshResume();

  /* 调试与自动化测试接口 */
  if (typeof window !== "undefined") {
    window.__careerMBTI = { compute: compute, TYPES: TYPES, ROLES: ROLES, QUESTIONS: QUESTIONS, DIMS: DIMS };
  }
})();

</script>
</body>
</html>
